name: Feature request
description: Suggest an improvement. Please read docs/design-principles.md first — freshDB deliberately refuses some features.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what is hard today? Real use cases beat abstract ones.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: principles
    attributes:
      label: Fit
      options:
        - label: I read docs/design-principles.md and this does not conflict with "what we refuse to build" (or I explain why it should change).
          required: true
