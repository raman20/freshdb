name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash   # bash -eo pipefail, so piped test output can't hide failures

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: govulncheck (fails on vulnerabilities the code can reach)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: exported API unchanged unless api/ is updated (docs/api-stability.md)
        run: |
          scripts/api-surface.sh
          git diff --exit-code api/ || { echo "exported API changed: run scripts/api-surface.sh, commit api/, and add a CHANGELOG line if it breaks"; exit 1; }
      - name: release dry run (SBOM, checksums, signature verifies with a throwaway key)
        run: |
          ssh-keygen -q -t ed25519 -N '' -f /tmp/k
          FRESHDB_SIGN_KEY=/tmp/k scripts/release.sh v0.0.0-ci > /dev/null
          echo "release@freshdb $(cat /tmp/k.pub)" > /tmp/allowed
          ssh-keygen -Y verify -f /tmp/allowed -I release@freshdb -n freshdb-release -s dist/checksums.txt.sig < dist/checksums.txt
          (cd dist && sha256sum -c checksums.txt)
          python3 -c "import json; d=json.load(open('dist/sbom.spdx.json')); assert len(d['packages']) > 5"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test -race
        run: go test -race -count=1 ./...
      - name: build + CLI smoke + agent demo
        run: |
          go build -o /tmp/freshdb ./cmd/freshdb
          /tmp/freshdb --help | head -3
          go run ./examples/tour
          FRESHDB=/tmp/freshdb DATA=/tmp/demo ./examples/agent-demo.sh

  cross:
    name: macOS tests + cross builds
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - name: cross-compile (CGO off)
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 freebsd/amd64; do
            CGO_ENABLED=0 GOOS=${t%/*} GOARCH=${t#*/} go build -o /dev/null ./cmd/freshdb || { echo "$t FAILED"; exit 1; }; echo "$t ok"
          done

  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: deterministic simulation, 2000 seeds
        run: go test -count=1 -run 'TestSimulation|TestDeterminism' ./sim -seeds=2000 -v -timeout 30m | grep -E "seeds OK|^(--- |ok|FAIL|PASS)"
      - name: crash test, 50 kill -9 rounds
        run: FRESHDB_CRASH_ITERS=50 go test -count=1 -run TestCrashKill9 -v . | grep -E "^(--- |ok|FAIL)|crash"

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [FuzzDecodeSegment, FuzzDecodePayload]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime=20s ./format
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crasher-${{ matrix.target }}
          path: format/testdata/fuzz

  s3:
    name: s3 (MinIO)
    runs-on: ubuntu-latest
    env:
      MINIO_ROOT_USER: ci-test-user
      MINIO_ROOT_PASSWORD: ci-test-password-not-secret
      MINIO_VERSION: v0.0.0-20260212201848-7aac2a2c5b7c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # MinIO no longer publishes Docker Hub images or prebuilt binaries, so build
      # the server from source at a pinned version (the one tested locally) and cache it.
      - name: cache MinIO server
        id: minio-cache
        uses: actions/cache@v4
        with:
          path: ~/minio-bin/minio
          key: minio-${{ env.MINIO_VERSION }}-${{ runner.os }}
      - name: build MinIO server
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: GOBIN=$HOME/minio-bin go install github.com/minio/minio@${MINIO_VERSION}
      - name: start MinIO
        run: |
          mkdir -p /tmp/minio-data
          nohup ~/minio-bin/minio server /tmp/minio-data --address 127.0.0.1:9000 > /tmp/minio.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          curl -fs http://127.0.0.1:9000/minio/health/live || { cat /tmp/minio.log; exit 1; }
      - name: S3 conformance + end-to-end (conditional writes, fencing, shred)
        env:
          FRESHDB_TEST_S3: s3://freshdb-ci?endpoint=127.0.0.1:9000&insecure=1&create=1
          AWS_ACCESS_KEY_ID: ci-test-user
          AWS_SECRET_ACCESS_KEY: ci-test-password-not-secret
        run: |
          set -o pipefail
          go test -race -count=1 -run 'S3' -v ./ ./store | grep -E "^(--- |ok|FAIL)"
      - name: CLI against MinIO
        env:
          AWS_ACCESS_KEY_ID: ci-test-user
          AWS_SECRET_ACCESS_KEY: ci-test-password-not-secret
        run: |
          go build -o /tmp/freshdb ./cmd/freshdb
          export FRESHDB_URL='s3://freshdb-ci/cli?endpoint=127.0.0.1:9000&insecure=1&create=1'
          /tmp/freshdb put hello world
          test "$(/tmp/freshdb get hello)" = world
          /tmp/freshdb s3check --large-mib 8
          /tmp/freshdb verify

  bench-smoke:
    name: benchmark smoke (tiny sizes; numbers are meaningless)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: bench/go.mod
          cache-dependency-path: bench/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: run every suite at tiny size (fails if a txn invariant or exactly-once check fails)
        run: OUT=$RUNNER_TEMP/bench-smoke scripts/smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-smoke-results
          path: ${{ runner.temp }}/bench-smoke

  tla:
    name: TLA+ (TLC)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: cache tla2tools.jar
        uses: actions/cache@v4
        with:
          path: ~/tla/tla2tools.jar
          key: tla2tools-v1.7.4-936a2620
      - name: download and verify tla2tools.jar (pinned v1.7.4)
        run: spec/get_tla.sh $HOME/tla/tla2tools.jar
      - name: model-check all specs
        run: TLC_XMX=5g TLA_JAR=$HOME/tla/tla2tools.jar spec/run_tlc.sh
